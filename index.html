<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>

   <style>
        section {
            width: 50%;
            border: 2px solid #ccc;
            border-radius: 5px;
            margin-left: 25%;
            background-color: white;
        }

        h4 {
            text-align: center;
            background-color: lightgray;
            padding: 10px;
            margin: 0;
        }

        #info {
            background-color: skyblue;
            margin: 10px;
            color: rgb(8, 71, 96);
            padding: 10px;
            border-radius: 5px;
        }

        /* champs avec icône */
        .input-group {
            display: flex;
            align-items: center;
            margin: 10px;
        }

        .icon {
            width: 40px;
            height: 40px;
            background-color: #eeeeee;
            border: 1px solid #ccc;
            border-right: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            height: 40px;
            border: 1px solid #ccc;
            padding-left: 10px;
            border-radius: 0 5px 5px 0;
        }

        button {
            padding: 8px;
            color: white;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .divbtn {
            text-align: right;
            margin-right: 10px;
        }

        .divbtn button {
            background-color: rgb(51, 164, 209);
        }

        .bottom {
            margin: 15px;
            display: flex;
            gap: 5px;
        }

        .bottom button,
        .bottom a {
            flex: 1;
            text-align: center;
            padding: 8px;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .orange {
            background-color: #f0ad4e;
        }

        .blue {
            background-color: #337ab7;
        }

        .green {
            background-color: #5cb85c;
        }
    </style>
</head>

<body>

<section>
    <h4>Espace étudiants</h4>

    <div id="info">
        Veuillez renseigner le nom d'utilisateur et le mot de passe
    </div>

    <form>
        <div class="input-group">
            <span class="icon">👤</span>
            <input type="text" placeholder="Nom d'utilisateur">
        </div>

        <div class="input-group">
            <span class="icon">🔒</span>
            <input type="password" placeholder="Mot de passe">
        </div>

        <div class="divbtn">
            <button>Se connecter</button>
        </div>
    </form>

    <div class="bottom">
        <button class="orange">Mot de passe oublié ?</button>
        <button class="blue">Vérifier autorisation ?</button>
        <a href="compte.html" class="green">Créer un compte</a>
    </div>
</section>

</body>
</html>
