<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>

   
</head>

<body>

<section>
    <h4>Espace étudiants</h4>

    <div id="info">
        Veuillez renseigner le nom d'utilisateur et le mot de passe
    </div>

    <form>
        <div class="input-group">
            <span class="icon">👤</span>
            <input type="text" placeholder="Nom d'utilisateur">
        </div>

        <div class="input-group">
            <span class="icon">🔒</span>
            <input type="password" placeholder="Mot de passe">
        </div>

        <div class="divbtn">
            <button>Se connecter</button>
        </div>
    </form>

    <div class="bottom">
        <button class="orange">Mot de passe oublié ?</button>
        <button class="blue">Vérifier autorisation ?</button>
        <a href="compte.html" class="green">Créer un compte</a>
    </div>
</section>

</body>
</html>
